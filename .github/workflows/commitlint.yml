name: Commitlint

on:
  pull_request:
    types:
      - opened
      - edited
      - synchronize

permissions:
  pull-requests: read
  statuses: write

jobs:
  validate-pr-title:
    name: Validate PR title
    runs-on: ubuntu-latest
    steps:
      - name: Check PR title follows Conventional Commits
        uses: amannn/action-semantic-pull-request@2252a14e810aa9b85c2d560bd7070c802206ecf6  # v6.1.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Allowed Conventional Commit types for this repo.
          # Keep in sync with the types used in squash-merge commit messages.
          types: |
            feat
            fix
            docs
            chore
            ci
            refactor
            test
            perf
            build
            style
            revert
          # Scope is optional; allow any scope string when present.
          requireScope: false
