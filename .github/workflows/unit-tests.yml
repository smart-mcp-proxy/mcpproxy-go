name: Unit Tests

on:
  push:
    branches: ["*"]
  pull_request:
    branches: ["*"]

jobs:
  # Build frontend once and share across all jobs
  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: cd frontend && npm ci

      - name: Build frontend
        run: cd frontend && npm run build

      - name: Upload frontend artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 1

  verify-oas:
    name: Verify OpenAPI Artifacts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version: "1.25"

      - name: Install swag
        run: go install github.com/swaggo/swag/v2/cmd/swag@v2.0.0-rc4

      - name: Regenerate and verify OpenAPI spec
        run: scripts/verify-oas.sh

  test:
    name: Unit Tests
    needs: [build-frontend, verify-oas]
    runs-on: ${{ matrix.os }}

    env:
      GO111MODULE: "on"

    strategy:
      matrix:
        # On PRs: test only ubuntu-latest. On main/push: test all OSes.
        # Go is pinned to "1.25" because go.mod requires go 1.25.5 — older
        # toolchains can't build the module, and auto-downloading 1.25.x under
        # setup-go's module cache collides ("tar: ... File exists").
        os: ${{ github.event_name == 'pull_request' && fromJSON('["ubuntu-latest"]') || fromJSON('["ubuntu-latest", "macos-latest", "windows-latest"]') }}
        go-version: ["1.25"]

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version: ${{ matrix.go-version }}
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Verify dependencies
        run: go mod verify

      # Spec 083: the bench/arms tscg tests spawn the committed Node shim
      # (bench/tscg/shim.mjs) and hard-fail (never skip) under CI per FR-006, so
      # the tscg runtime must be provisioned wherever `go test ./...` runs.
      - name: Set up Node.js (TSCG bench arm)
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: bench/tscg/package-lock.json

      - name: Install pinned TSCG shim dependencies (FR-006)
        run: npm ci --prefix bench/tscg

      - name: Download frontend artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: frontend-dist
          path: frontend/dist

      - name: Copy frontend dist for embedding
        if: matrix.os != 'windows-latest'
        run: |
          rm -rf web/frontend
          mkdir -p web/frontend
          cp -r frontend/dist web/frontend/

      - name: Copy frontend dist for embedding (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          if (Test-Path web/frontend) { Remove-Item -Recurse -Force web/frontend }
          New-Item -ItemType Directory -Force -Path web/frontend
          Copy-Item -Recurse frontend/dist web/frontend/

      # Warm the tiktoken vocabulary ONCE, before the parallel test run.
      #
      # tiktoken-go downloads the BPE on first use into a shared temp dir and
      # finishes with an atomic rename. `go test ./...` runs packages in
      # parallel, so several test binaries race to download the same file, and
      # on Windows the loser hits "Access is denied" on the rename and the
      # package fails — observed as TestBaseline_CountToolWithSchemaParity
      # flaking in bench/arms with no code change anywhere near it.
      #
      # Setting TIKTOKEN_CACHE_DIR alone does NOT fix this: it only names a
      # cache, and an empty one still races. Populating it first does, because
      # every later tokenizer construction is a cache hit with no rename.
      - name: Warm the tiktoken vocabulary cache
        run: go run ./bench/cmd/warmtiktoken
        env:
          TIKTOKEN_CACHE_DIR: ${{ runner.temp }}/tiktoken

      - name: Run unit tests (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: go test -v -race -timeout 10m '-coverprofile=coverage.out' -covermode=atomic '-skip=E2E|Binary|MCPProtocol|TestInfoEndpoint|TestGracefulShutdownNoPanic|TestSocketInfoEndpoint' ./...
        env:
          TIKTOKEN_CACHE_DIR: ${{ runner.temp }}/tiktoken

      - name: Run unit tests (Unix)
        if: matrix.os != 'windows-latest'
        run: go test -v -race -coverprofile=coverage.out -skip "E2E|Binary|MCPProtocol|TestInfoEndpoint|TestGracefulShutdownNoPanic|TestSocketInfoEndpoint" ./...
        env:
          TIKTOKEN_CACHE_DIR: ${{ runner.temp }}/tiktoken

      - name: Generate coverage report (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: go tool cover '-html=coverage.out' -o coverage.html

      - name: Generate coverage report (Unix)
        if: matrix.os != 'windows-latest'
        run: go tool cover -html=coverage.out -o coverage.html

      - name: Upload coverage to Codecov
        if: matrix.os == 'ubuntu-latest' && matrix.go-version == '1.25'
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f  # v7.0.0
        with:
          file: ./coverage.out
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

      - name: Upload coverage artifacts
        if: matrix.os == 'ubuntu-latest' && matrix.go-version == '1.25'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: coverage-report
          path: |
            coverage.out
            coverage.html

  lint:
    name: Lint
    needs: [build-frontend, verify-oas]
    runs-on: ubuntu-latest

    env:
      GO111MODULE: "on"

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version: "1.25"

      - name: Download frontend artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: frontend-dist
          path: frontend/dist

      - name: Copy frontend dist for embedding
        run: |
          rm -rf web/frontend
          mkdir -p web/frontend
          cp -r frontend/dist web/frontend/

      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a  # v9.3.0
        with:
          version: v2.6.2
          args: --config .github/.golangci.yml --timeout=10m
          # skip-cache: the action's cross-run analysis cache produced stale
          # staticcheck facts (SA5011 on t.Fatal no-return sites) that do not
          # reproduce with the same version+config on a clean run. Cold runs
          # cost ~2-3 min extra; correctness wins. Revisit after upstream
          # cache-invalidation fix.
          skip-cache: true

  server-edition:
    name: Server Edition
    runs-on: ubuntu-latest
    env:
      GO111MODULE: "on"

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version: "1.25"
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Verify dependencies
        run: go mod verify

      - name: Build server edition
        run: go build -tags server ./cmd/mcpproxy

      # internal/oauth is where the redaction rules live, and half of them are
      # build-tagged: serverfields_serveredition.go holds the mask decisions for
      # the `auth_broker` block, whose fields do not exist in the personal
      # edition. Its canaries — the walk over config.ServerConfig that fails
      # when a text-carrying leaf has no decision — therefore only compile under
      # `-tags server`. Without this package in the list they never ran, and the
      # guarantee the #1161 fix rests on (a field added to the tagged block is
      # masked because the walk reaches it) was unenforced in CI.
      - name: Test server edition packages
        run: go test -race -tags server ./internal/serveredition/... ./internal/config/... ./internal/oauth/...

  build:
    name: Build
    needs: [build-frontend, verify-oas]
    runs-on: ${{ matrix.os }}

    env:
      GO111MODULE: "on"

    strategy:
      matrix:
        # On PRs: build only on ubuntu-latest
        # On main/push: build on all platforms
        os: ${{ github.event_name == 'pull_request' && fromJSON('["ubuntu-latest"]') || fromJSON('["ubuntu-latest", "macos-latest", "windows-latest"]') }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version: "1.25"
          cache: true

      - name: Download frontend artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: frontend-dist
          path: frontend/dist

      - name: Copy frontend dist for embedding (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          if (Test-Path web/frontend) { Remove-Item -Recurse -Force web/frontend }
          New-Item -ItemType Directory -Force -Path web/frontend
          Copy-Item -Recurse frontend/dist web/frontend/

      - name: Copy frontend dist for embedding (Unix)
        if: matrix.os != 'windows-latest'
        run: |
          rm -rf web/frontend
          mkdir -p web/frontend
          cp -r frontend/dist web/frontend/

      - name: Build (Windows)
        if: matrix.os == 'windows-latest'
        run: go build -v -o mcpproxy.exe ./cmd/mcpproxy

      - name: Build (Unix)
        if: matrix.os != 'windows-latest'
        run: go build -v ./cmd/mcpproxy

      - name: Build for different architectures (Linux only)
        if: matrix.os == 'ubuntu-latest'
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o mcpproxy-linux-amd64 ./cmd/mcpproxy
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -o mcpproxy-linux-arm64 ./cmd/mcpproxy
          CGO_ENABLED=0 GOOS=darwin GOARCH=amd64 go build -o mcpproxy-darwin-amd64 ./cmd/mcpproxy || echo "macOS amd64 cross-compilation may fail (expected)"
          CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -o mcpproxy-darwin-arm64 ./cmd/mcpproxy || echo "macOS arm64 cross-compilation may fail (expected)"
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -o mcpproxy-windows-amd64.exe ./cmd/mcpproxy

      - name: Upload build artifacts
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: binaries
          path: mcpproxy-*
