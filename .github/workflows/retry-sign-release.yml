name: Retry Sign & Release

# Use this workflow when the main Release workflow fails due to SignPath
# signing timeout (missed manual approval). It downloads build artifacts
# from the failed run, re-submits Windows EXEs for signing, assembles the
# same full artifact set that release.yml produces, and runs update-homebrew
# + publish-linux-repos so no distribution channel is skipped.
#
# FIXED (MCP-2905): corrected artifact download patterns, added Linux packages,
# SBOM/CHANGELOG/checksums/cosign, asset parity assertion, update-homebrew,
# publish-linux-repos, and SLSA provenance jobs.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g., v1.2.3)'
        required: true
        type: string
      run_id:
        description: 'Failed Release workflow run ID (from Actions URL)'
        required: true
        type: string
      post_release_only:
        description: >-
          Skip signing/assembly/release/homebrew/linux-repos and run only the
          post-release jobs (sparkle-appcast, retire-release-notice,
          deploy-docs, trigger-marketing-update, mcp-registry) against the
          already-published tag. Use this to catch up a release that was
          published (e.g. by a previous run of this workflow) without the
          jobs that release.yml normally runs after `release` — with no
          re-signing or re-uploading of release assets.
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  actions: read
  id-token: write  # cosign keyless signing + SLSA provenance

env:
  GITHUB_ENVIRONMENT: production

jobs:
  sign-windows:
    if: ${{ !inputs.post_release_only }}
    runs-on: ubuntu-latest
    environment: production
    strategy:
      matrix:
        arch: [amd64, arm64]

    steps:
      - name: Download unsigned installer from original run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p unsigned
          echo "Downloading unsigned-installer-windows-${{ matrix.arch }} from run ${{ inputs.run_id }}..."
          gh run download ${{ inputs.run_id }} \
            --repo ${{ github.repository }} \
            --name unsigned-installer-windows-${{ matrix.arch }} \
            --dir unsigned
          echo "Downloaded files:"
          ls -la unsigned/

      - name: Re-upload for SignPath
        id: reupload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: signpath-input-windows-${{ matrix.arch }}
          path: unsigned/*.exe

      - name: Submit to SignPath for signing
        uses: signpath/github-action-submit-signing-request@c92b958760219087e01f8d67a1669ed57afe2627  # v2.3
        with:
          api-token: '${{ secrets.SIGNPATH_API_TOKEN }}'
          organization-id: '84efd51b-c11c-4a85-82e6-7c3b1157d7ca'
          project-slug: 'mcpproxy-go'
          signing-policy-slug: 'release-signing'
          artifact-configuration-slug: 'initial'
          github-artifact-id: '${{ steps.reupload.outputs.artifact-id }}'
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: signed

      - name: Prepare signed installer
        run: |
          VERSION="${{ inputs.tag }}"
          ARCH="${{ matrix.arch }}"
          TARGET="mcpproxy-setup-${VERSION}-${ARCH}.exe"

          echo "Preparing signed installer..."
          cd signed
          ls -la

          if [ -f "$TARGET" ]; then
            echo "Signed installer already named correctly: $TARGET"
          else
            SIGNED_EXE=$(find . -name "*.exe" -type f | head -1)
            if [ -n "$SIGNED_EXE" ]; then
              mv "$SIGNED_EXE" "$TARGET"
              echo "Renamed to: $TARGET"
            else
              echo "No signed .exe found in SignPath output"
              exit 1
            fi
          fi

      - name: Upload signed Windows installer
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: installer-windows-${{ matrix.arch }}
          path: signed/mcpproxy-setup-${{ inputs.tag }}-${{ matrix.arch }}.exe

  release:
    needs: sign-windows
    if: ${{ !inputs.post_release_only }}
    runs-on: ubuntu-latest
    environment: production
    outputs:
      hashes: ${{ steps.checksums.outputs.hashes }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0

      - name: Download all artifacts from original run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p dist
          echo "Downloading artifacts from original run ${{ inputs.run_id }}..."

          # Versioned archives: mcpproxy-X.Y.Z-{os}-{arch}.{tar.gz|zip}
          # (artifact name pattern: versioned-personal-{os}-{arch})
          gh run download ${{ inputs.run_id }} \
            --repo ${{ github.repository }} \
            --dir dist \
            --pattern 'versioned-personal-*' || echo "No versioned archive artifacts found"

          # Latest-alias archives: mcpproxy-latest-{os}-{arch}.{tar.gz|zip}
          # (artifact name pattern: latest-personal-{os}-{arch})
          gh run download ${{ inputs.run_id }} \
            --repo ${{ github.repository }} \
            --dir dist \
            --pattern 'latest-personal-*' || echo "No latest archive artifacts found"

          # Linux .deb and .rpm packages
          # (artifact name pattern: linux-packages-{arch})
          gh run download ${{ inputs.run_id }} \
            --repo ${{ github.repository }} \
            --dir dist \
            --pattern 'linux-packages-*' || echo "No Linux package artifacts found"

          # macOS installer DMGs (signed + notarized)
          # (artifact name pattern: installers-{os}-{arch})
          gh run download ${{ inputs.run_id }} \
            --repo ${{ github.repository }} \
            --dir dist \
            --pattern 'installers-*' || echo "No macOS installer artifacts found"

          # Sparkle update enclosures: mcpproxy-X.Y.Z-darwin-{arch}.app.zip
          # (artifact name pattern: sparkle-enclosure-{arch}). release.yml gets
          # these for free via its pattern-less download-artifact; omitting them
          # here shipped v0.69.0 with appcast feeds whose enclosure URL 404'd, so
          # every tray auto-update failed with "couldn't download the update".
          gh run download ${{ inputs.run_id }} \
            --repo ${{ github.repository }} \
            --dir dist \
            --pattern 'sparkle-enclosure-*' || echo "No Sparkle enclosure artifacts found"

          # Release notes (AI-generated by original run)
          gh run download ${{ inputs.run_id }} \
            --repo ${{ github.repository }} \
            --dir dist \
            --pattern 'release-notes' || echo "No release notes artifact found"

          echo "Downloaded artifacts:"
          find dist -type f | head -60

      - name: Download signed Windows installers
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          path: dist
          pattern: installer-windows-*

      - name: Reorganize files
        run: |
          VERSION="${{ inputs.tag }}"
          mkdir -p release-files

          # Copy archives (tar.gz and zip files)
          find dist -name "*.tar.gz" -o -name "*.zip" | while read file; do
            filename=$(basename "$file")
            cp "$file" "release-files/$filename"
          done

          # Copy Linux .deb and .rpm packages
          find dist -path "*/linux-packages-*" \( -name "*.deb" -o -name "*.rpm" \) | while read pkg_file; do
            filename=$(basename "$pkg_file")
            echo "Found Linux package: $filename"
            cp "$pkg_file" "release-files/$filename"
          done

          # Copy Windows installer files (.exe)
          find dist -path "*/installer-windows-*" -name "*.exe" | while read installer_file; do
            filename=$(basename "$installer_file")
            echo "Found Windows installer: $filename"
            cp "$installer_file" "release-files/$filename"
          done

          # Handle installer files (DMG) and notarization submissions
          mkdir -p pending-notarizations
          find dist -path "*/installers-*" -name "*.dmg" | while read installer_file; do
            filename=$(basename "$installer_file")
            submission_id_file="${installer_file}.submission_id"
            if [ -f "$submission_id_file" ]; then
              SUBMISSION_ID=$(cat "$submission_id_file")
              if [ -n "$SUBMISSION_ID" ] && [ "$SUBMISSION_ID" != "null" ] && [ ${#SUBMISSION_ID} -gt 10 ]; then
                echo "Found valid pending notarization for $filename (ID: $SUBMISSION_ID)"
                cp "$installer_file" "release-files/$filename"
                cat > "pending-notarizations/${filename}.pending" << EOF
          {
            "submission_id": "$SUBMISSION_ID",
            "file_name": "$filename",
            "version": "$VERSION",
            "submitted_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF
              else
                cp "$installer_file" "release-files/$filename"
              fi
            else
              cp "$installer_file" "release-files/$filename"
            fi
          done

      - name: Set version variable
        run: |
          VERSION="${{ inputs.tag }}"
          echo "CLEAN_VERSION=${VERSION#v}" >> $GITHUB_ENV

      # Generate SPDX SBOM from source tree at the release tag (mirrors release.yml WP-C2)
      - name: Generate SBOM (SPDX JSON)
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          path: .
          format: spdx-json
          output-file: release-files/mcpproxy-${{ env.CLEAN_VERSION }}.spdx.json
          upload-artifact: false
          upload-release-assets: false

      # Generate cumulative CHANGELOG with git-cliff (mirrors release.yml WP-C4)
      - name: Generate CHANGELOG (git-cliff)
        uses: orhun/git-cliff-action@a9a95522b26fe6403f7bb24031f21fb573d0f5ff # v4.9.1
        with:
          config: cliff.toml
          args: --verbose
        env:
          OUTPUT: release-files/CHANGELOG.md
          GITHUB_REPO: ${{ github.repository }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Fail loudly if the assembled set is missing platforms or package types.
      # A complete release has ≥24 files at this point:
      #   6 versioned archives + 6 latest archives + 4 Linux packages
      #   + 2 Windows EXEs + 2 macOS DMGs + 2 Sparkle enclosures
      #   + 1 SBOM + 1 CHANGELOG = 24
      # (checksums.txt and cosign bundle are added in subsequent steps)
      - name: Assert minimum asset count
        run: |
          MIN_ASSETS=24
          ASSET_COUNT=$(find release-files -maxdepth 1 -type f | wc -l)
          echo "Asset count: $ASSET_COUNT (minimum: $MIN_ASSETS)"
          if [ "$ASSET_COUNT" -lt "$MIN_ASSETS" ]; then
            echo "❌ INCOMPLETE RELEASE: only $ASSET_COUNT assets assembled, expected ≥ $MIN_ASSETS"
            echo ""
            echo "Expected breakdown:"
            echo "  6 versioned archives  (versioned-personal-* pattern from original run)"
            echo "  6 latest archives     (latest-personal-* pattern from original run)"
            echo "  4 Linux packages      (linux-packages-* pattern from original run)"
            echo "  2 Windows EXEs        (installer-windows-* from this run's sign-windows job)"
            echo "  2 macOS DMGs          (installers-* pattern from original run)"
            echo "  2 Sparkle enclosures  (sparkle-enclosure-* pattern from original run)"
            echo "  1 SBOM (.spdx.json)"
            echo "  1 CHANGELOG.md"
            echo ""
            echo "Files found:"
            ls -la release-files/
            exit 1
          fi
          echo "✅ Asset count OK: $ASSET_COUNT"

      - name: Generate checksums
        id: checksums
        run: |
          cd release-files
          find . -maxdepth 1 -type f ! -name 'checksums.txt' ! -name 'checksums.txt.cosign.bundle' -printf '%P\n' \
            | sort | xargs -r sha256sum > checksums.txt
          echo "Generated checksums:"
          cat checksums.txt
          echo "hashes=$(base64 -w0 checksums.txt)" >> "$GITHUB_OUTPUT"

      - name: List files for upload
        run: |
          echo "Files to upload:"
          ls -la release-files/
          echo "Pending notarizations:"
          ls -la pending-notarizations/ || echo "No pending notarizations"

      # A hand-written notice that must reach the release body verbatim.
      # Mirrors release.yml's "Load hand-written release notice" step: the
      # generated/fallback notes below are fine for a feature summary and
      # wrong for anything a user has to ACT on (security advisory, migration
      # step, breaking change), so those are authored in
      # .github/RELEASE_NOTICE.md and prepended here too. No-op when the file
      # is absent. The checkout above is pinned to ${{ inputs.tag }}, so this
      # reads the notice as it existed at the released tag.
      - name: Load hand-written release notice
        id: notice
        run: |
          if [ -f .github/RELEASE_NOTICE.md ]; then
            echo "Found .github/RELEASE_NOTICE.md - prepending to the release body"
            {
              echo "notice<<RELEASE_NOTICE_EOF"
              cat .github/RELEASE_NOTICE.md
              echo ""
              echo "---"
              echo "RELEASE_NOTICE_EOF"
            } >> "$GITHUB_OUTPUT"
          else
            echo "No .github/RELEASE_NOTICE.md - nothing to prepend"
            echo "notice=" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate release notes
        id: notes
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          VERSION="${{ inputs.tag }}"

          # Try to use notes from original run
          NOTES_FILE=$(find dist -name "RELEASE_NOTES-*.md" -type f | head -1)
          if [ -n "$NOTES_FILE" ]; then
            echo "Using release notes from original run"
            NOTES=$(cat "$NOTES_FILE")
          else
            # Fallback: generate from commit history
            PREV_TAG=$(git describe --tags --abbrev=0 "${VERSION}^" 2>/dev/null || echo "")
            if [ -n "$PREV_TAG" ]; then
              COMMITS=$(git log "${PREV_TAG}..${VERSION}" --pretty=format:"- %s" --no-merges | head -50)
            else
              COMMITS=$(git log --pretty=format:"- %s" --no-merges | head -50)
            fi
            NOTES="## Changes

          ${COMMITS}"
          fi

          echo "notes<<EOF" >> $GITHUB_OUTPUT
          echo "$NOTES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create release with binaries
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64  # v3.0.3
        with:
          tag_name: ${{ inputs.tag }}
          files: release-files/*
          body: |
            ${{ steps.notice.outputs.notice }}

            ${{ steps.notes.outputs.notes }}

            ---

            ## Download Installers

            | Platform | Download | Notes |
            |----------|----------|-------|
            | **macOS (Apple Silicon)** | [**Download DMG**](https://github.com/${{ github.repository }}/releases/download/${{ inputs.tag }}/mcpproxy-${{ env.CLEAN_VERSION }}-darwin-arm64-installer.dmg) | Signed & Notarized - Recommended for M1/M2/M3/M4 |
            | **macOS (Intel)** | [**Download DMG**](https://github.com/${{ github.repository }}/releases/download/${{ inputs.tag }}/mcpproxy-${{ env.CLEAN_VERSION }}-darwin-amd64-installer.dmg) | Signed & Notarized |
            | **Windows (64-bit)** | [**Download Setup**](https://github.com/${{ github.repository }}/releases/download/${{ inputs.tag }}/mcpproxy-setup-${{ inputs.tag }}-amd64.exe) | Setup wizard |
            | **Windows (ARM64)** | [**Download Setup**](https://github.com/${{ github.repository }}/releases/download/${{ inputs.tag }}/mcpproxy-setup-${{ inputs.tag }}-arm64.exe) | For ARM Windows devices |
            | **Linux Debian/Ubuntu (AMD64)** | [**Download .deb**](https://github.com/${{ github.repository }}/releases/download/${{ inputs.tag }}/mcpproxy_${{ env.CLEAN_VERSION }}_amd64.deb) | `sudo apt install ./mcpproxy_*.deb` |
            | **Linux Debian/Ubuntu (ARM64)** | [**Download .deb**](https://github.com/${{ github.repository }}/releases/download/${{ inputs.tag }}/mcpproxy_${{ env.CLEAN_VERSION }}_arm64.deb) | For ARM64 (Raspberry Pi etc.) |
            | **Linux Fedora/RHEL (AMD64)** | [**Download .rpm**](https://github.com/${{ github.repository }}/releases/download/${{ inputs.tag }}/mcpproxy-${{ env.CLEAN_VERSION }}-1.x86_64.rpm) | `sudo dnf install ./mcpproxy-*.rpm` |
            | **Linux Fedora/RHEL (ARM64)** | [**Download .rpm**](https://github.com/${{ github.repository }}/releases/download/${{ inputs.tag }}/mcpproxy-${{ env.CLEAN_VERSION }}-1.aarch64.rpm) | For ARM64 |
            | **Linux (AMD64) — tarball** | [**Download tar.gz**](https://github.com/${{ github.repository }}/releases/download/${{ inputs.tag }}/mcpproxy-${{ env.CLEAN_VERSION }}-linux-amd64.tar.gz) | Binary only |
            | **Linux (ARM64) — tarball** | [**Download tar.gz**](https://github.com/${{ github.repository }}/releases/download/${{ inputs.tag }}/mcpproxy-${{ env.CLEAN_VERSION }}-linux-arm64.tar.gz) | Binary only |

            **Homebrew (macOS/Linux):**
            ```bash
            brew install smart-mcp-proxy/mcpproxy/mcpproxy
            ```
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # Keyless cosign signature — OIDC identity from the GitHub Actions JWT.
      # id-token: write is granted at the workflow level.
      - name: Sign checksums (keyless)
        run: |
          cosign sign-blob \
            --yes \
            --bundle release-files/checksums.txt.cosign.bundle \
            release-files/checksums.txt

      - name: Upload cosign bundle to release
        run: |
          gh release upload "${{ inputs.tag }}" \
            release-files/checksums.txt.cosign.bundle \
            --clobber
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload pending notarizations
        if: hashFiles('pending-notarizations/*.pending') != ''
        run: |
          for pending_file in pending-notarizations/*.pending; do
            if [ -f "$pending_file" ]; then
              echo "Uploading pending notarization: $(basename "$pending_file")"
              gh release upload "${{ inputs.tag }}" "$pending_file" --clobber
            fi
          done
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # SLSA v1 provenance attestation — mirrors release.yml WP-C3.
  # upload-tag-name directs the generator to the correct release (needed because
  # this workflow is triggered by workflow_dispatch on a branch, not a tag push).
  provenance:
    needs: [release]
    if: ${{ !inputs.post_release_only }}
    permissions:
      actions: read
      id-token: write
      contents: write
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0
    with:
      base64-subjects: ${{ needs.release.outputs.hashes }}
      upload-assets: true
      upload-tag-name: ${{ inputs.tag }}

  update-homebrew:
    needs: release
    runs-on: ubuntu-latest
    environment: production
    if: ${{ !inputs.post_release_only && github.repository == 'smart-mcp-proxy/mcpproxy-go' && !contains(inputs.tag, '-') }}

    steps:
      - name: Checkout tap repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: smart-mcp-proxy/homebrew-mcpproxy
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap

      - name: Download platform binaries and calculate SHA256
        run: |
          TAG="${{ inputs.tag }}"
          VERSION="${TAG#v}"
          echo "Processing version: ${VERSION}"

          # Wait for GitHub release assets to propagate
          sleep 15

          # Define platforms
          PLATFORMS=("darwin-arm64" "darwin-amd64" "linux-arm64" "linux-amd64")
          BASE_URL="https://github.com/${{ github.repository }}/releases/download/${TAG}"

          # Download each platform tarball and calculate SHA256
          for PLATFORM in "${PLATFORMS[@]}"; do
            TARBALL="mcpproxy-${VERSION}-${PLATFORM}.tar.gz"
            URL="${BASE_URL}/${TARBALL}"
            echo "Downloading ${PLATFORM}: ${URL}"

            # Try downloading with retries
            for i in {1..5}; do
              echo "  Attempt ${i}/5..."
              if curl -fsSL "${URL}" -o "${TARBALL}"; then
                echo "  Download successful"
                break
              else
                echo "  Download failed, retrying in 10 seconds..."
                sleep 10
              fi

              if [ $i -eq 5 ]; then
                echo "All download attempts failed for ${PLATFORM}"
                curl -I "${URL}" || true
                exit 1
              fi
            done

            # Calculate SHA256 and export as environment variable
            SHA=$(sha256sum "${TARBALL}" | cut -d' ' -f1)
            VAR_NAME="SHA256_$(echo ${PLATFORM} | tr '-' '_' | tr '[:lower:]' '[:upper:]')"
            echo "${VAR_NAME}=${SHA}" >> $GITHUB_ENV
            echo "  SHA256: ${SHA}"

            # Clean up tarball
            rm -f "${TARBALL}"
          done

          echo "VERSION=${VERSION}" >> $GITHUB_ENV

      - name: Generate Homebrew formula
        run: |
          cd tap
          mkdir -p Formula

          cat > Formula/mcpproxy.rb << 'FORMULA_EOF'
          class Mcpproxy < Formula
            desc "Smart MCP Proxy - Intelligent tool discovery and proxying for MCP servers"
            homepage "https://github.com/smart-mcp-proxy/mcpproxy-go"
            version "${VERSION}"
            license "MIT"

            on_macos do
              if Hardware::CPU.arm?
                url "https://github.com/smart-mcp-proxy/mcpproxy-go/releases/download/v${VERSION}/mcpproxy-${VERSION}-darwin-arm64.tar.gz"
                sha256 "${SHA256_DARWIN_ARM64}"
              else
                url "https://github.com/smart-mcp-proxy/mcpproxy-go/releases/download/v${VERSION}/mcpproxy-${VERSION}-darwin-amd64.tar.gz"
                sha256 "${SHA256_DARWIN_AMD64}"
              end
            end

            on_linux do
              if Hardware::CPU.arm?
                url "https://github.com/smart-mcp-proxy/mcpproxy-go/releases/download/v${VERSION}/mcpproxy-${VERSION}-linux-arm64.tar.gz"
                sha256 "${SHA256_LINUX_ARM64}"
              else
                url "https://github.com/smart-mcp-proxy/mcpproxy-go/releases/download/v${VERSION}/mcpproxy-${VERSION}-linux-amd64.tar.gz"
                sha256 "${SHA256_LINUX_AMD64}"
              end
            end

            def install
              bin.install "mcpproxy"
              bin.install "mcpproxy-tray" if OS.mac? && File.exist?("mcpproxy-tray")
            end

            test do
              assert_match version.to_s, shell_output("#{bin}/mcpproxy --version")
            end
          end
          FORMULA_EOF

          # Remove the 10-space YAML indentation from the formula
          sed -i 's/^          //' Formula/mcpproxy.rb

          # Substitute environment variables
          sed -i "s/\${VERSION}/${VERSION}/g" Formula/mcpproxy.rb
          sed -i "s/\${SHA256_DARWIN_ARM64}/${SHA256_DARWIN_ARM64}/g" Formula/mcpproxy.rb
          sed -i "s/\${SHA256_DARWIN_AMD64}/${SHA256_DARWIN_AMD64}/g" Formula/mcpproxy.rb
          sed -i "s/\${SHA256_LINUX_ARM64}/${SHA256_LINUX_ARM64}/g" Formula/mcpproxy.rb
          sed -i "s/\${SHA256_LINUX_AMD64}/${SHA256_LINUX_AMD64}/g" Formula/mcpproxy.rb

          echo "Formula created successfully:"
          cat Formula/mcpproxy.rb

      - name: Download installer DMGs and calculate SHA256 for cask
        run: |
          TAG="${{ inputs.tag }}"
          VERSION="${TAG#v}"
          BASE_URL="https://github.com/${{ github.repository }}/releases/download/${TAG}"

          for ARCH in arm64 amd64; do
            DMG="mcpproxy-${VERSION}-darwin-${ARCH}-installer.dmg"
            URL="${BASE_URL}/${DMG}"
            echo "Downloading ${DMG}..."
            for i in {1..5}; do
              echo "  Attempt ${i}/5..."
              if curl -fsSL "${URL}" -o "${DMG}"; then
                echo "  Download successful"
                break
              else
                echo "  Download failed, retrying in 10 seconds..."
                sleep 10
              fi
              if [ $i -eq 5 ]; then
                echo "All download attempts failed for ${DMG}"
                curl -I "${URL}" || true
                exit 1
              fi
            done
            SHA=$(sha256sum "${DMG}" | cut -d' ' -f1)
            VAR_NAME="SHA256_CASK_$(echo ${ARCH} | tr '[:lower:]' '[:upper:]')"
            echo "${VAR_NAME}=${SHA}" >> $GITHUB_ENV
            echo "  SHA256: ${SHA}"
            rm -f "${DMG}"
          done

      - name: Update Homebrew cask
        run: |
          cd tap
          mkdir -p Casks
          CASK_FILE="Casks/mcpproxy.rb"

          if [ ! -f "${CASK_FILE}" ]; then
            echo "Cask file not found at ${CASK_FILE}, skipping cask update"
            exit 0
          fi

          # Bump version and both sha256 values in place
          sed -i "s/version \"[^\"]*\"/version \"${VERSION}\"/" "${CASK_FILE}"
          # arm64 sha256 is the first occurrence, amd64 is the second
          sed -i "0,/sha256 \"[^\"]*\"/{s/sha256 \"[^\"]*\"/sha256 \"${SHA256_CASK_ARM64}\"/}" "${CASK_FILE}"
          sed -i "0,/sha256 \"${SHA256_CASK_ARM64}\"/{b}; s/sha256 \"[^\"]*\"/sha256 \"${SHA256_CASK_AMD64}\"/" "${CASK_FILE}"

          echo "Cask updated:"
          cat "${CASK_FILE}"

      - name: Commit and push changes
        run: |
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/mcpproxy.rb Casks/mcpproxy.rb

          # Check if there are changes to commit
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update mcpproxy to ${VERSION} (pre-built binaries)"
            git push
            echo "Changes committed and pushed successfully"
          fi

  # Publish signed apt/yum repositories to Cloudflare R2 (mirrors release.yml)
  publish-linux-repos:
    needs: [release]
    if: ${{ !inputs.post_release_only && github.repository == 'smart-mcp-proxy/mcpproxy-go' && !contains(inputs.tag, '-') }}
    runs-on: ubuntu-latest
    environment: production

    env:
      APT_BUCKET: mcpproxy-apt
      RPM_BUCKET: mcpproxy-rpm
      APT_BASE_URL: https://apt.mcpproxy.app
      RPM_BASE_URL: https://rpm.mcpproxy.app
      GPG_KEY_ID: ${{ vars.PACKAGES_GPG_KEY_ID }}
      RETAIN_N: "10"
      AWS_ENDPOINT_URL: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
      AWS_DEFAULT_REGION: auto
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      PACKAGES_GPG_PRIVATE_KEY: ${{ secrets.PACKAGES_GPG_PRIVATE_KEY }}
      PACKAGES_GPG_PASSPHRASE: ${{ secrets.PACKAGES_GPG_PASSPHRASE }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ inputs.tag }}

      - name: Install repo tooling
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq apt-utils createrepo-c gnupg rpm
          aws --version

      # In the retry workflow the packages are in the *original* failed run,
      # not this run's artifacts, so we use gh run download instead of
      # actions/download-artifact.  Flatten subdirs to match the flat layout
      # that publish.sh expects (same as actions/download-artifact merge-multiple: true).
      - name: Download Linux package artifacts from original run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p raw-packages release-artifacts
          gh run download ${{ inputs.run_id }} \
            --repo ${{ github.repository }} \
            --pattern 'linux-packages-*' \
            --dir raw-packages
          # Flatten subdirectories into a single directory for publish.sh
          find raw-packages -name "*.deb" -o -name "*.rpm" | while read f; do
            cp "$f" release-artifacts/
          done

      - name: List downloaded artifacts
        run: |
          echo "Contents of release-artifacts:"
          find release-artifacts -type f | sort

      - name: Publish apt + rpm repositories to R2
        run: contrib/linux-repos/publish.sh release-artifacts

      - name: Smoke-test install (Debian)
        run: |
          TAG="${{ inputs.tag }}"
          contrib/linux-repos/smoke-test-debian.sh "${TAG#v}"

      - name: Smoke-test install (Fedora)
        run: |
          TAG="${{ inputs.tag }}"
          contrib/linux-repos/smoke-test-fedora.sh "${TAG#v}"

  # ---------------------------------------------------------------------
  # Post-release jobs (parity with release.yml's sparkle-appcast,
  # retire-release-notice, deploy-docs, trigger-marketing-update and
  # mcp-registry jobs). release.yml runs these after its own `release` job
  # publishes the GitHub release; this workflow's retry path never ran them
  # for a release published here, because retry-sign-release.yml predates
  # their addition to release.yml.
  #
  # `if: !cancelled() && (needs.release.result == 'success' || inputs.post_release_only)`
  # lets each job run either right after a successful retry-publish in this
  # same run, OR standalone with `post_release_only: true` against a tag that
  # was already published by an earlier run. In that second case `release` is
  # SKIPPED (not failed), so `needs.release.result == 'success'` alone would
  # NOT resolve these — `|| inputs.post_release_only` is load-bearing, not
  # just documentation. `!cancelled()` (rather than `always()`) is required
  # because a job whose `needs` entry was skipped is itself skipped by
  # default, while still refusing to run these publish/dispatch steps if the
  # workflow run itself was cancelled.
  #
  # Every ref/ GITHUB_REF_NAME use from release.yml becomes ${{ inputs.tag }}
  # (this workflow is workflow_dispatch on a branch — github.ref_name here is
  # the branch, not the release tag) and artifacts that release.yml jobs pull
  # from the SAME run's build job are instead pulled from the original
  # release.yml run via `gh run download ${{ inputs.run_id }}`, since this
  # workflow never runs that build job itself.

  # Spec 092 FR-013 — the Sparkle update feed. See release.yml's sparkle-appcast
  # job for the full design rationale (one feed per architecture, beta-feed
  # refresh, live-freshness verification). This copy differs only in where the
  # enclosures come from (the original release.yml run's artifacts, via
  # `gh run download`, rather than this run's own build job) and in using
  # ${{ inputs.tag }} instead of github.ref_name throughout.
  sparkle-appcast:
    needs: [release]
    if: ${{ !cancelled() && (needs.release.result == 'success' || inputs.post_release_only) && !contains(inputs.tag, '-') }}
    runs-on: macos-15
    permissions:
      contents: write
      # gh run download reads another run's artifacts via the Artifacts REST
      # API, which needs actions: read even though this job only WRITES
      # release assets — unlike release.yml's copy (actions/download-artifact
      # pulling from the SAME run, which doesn't need it). Job-level
      # `permissions:` replaces the workflow-level grant (contents, actions,
      # id-token) rather than adding to it, so this must be listed explicitly
      # or the download 403s.
      actions: read
    steps:
      - name: Download Sparkle enclosures from original run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p enclosures
          echo "Downloading sparkle-enclosure-* artifacts from run ${{ inputs.run_id }}..."
          gh run download ${{ inputs.run_id }} \
            --repo ${{ github.repository }} \
            --dir enclosures \
            --pattern 'sparkle-enclosure-*'

      - name: Generate and publish the appcast
        id: appcast
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # This job deliberately does not check the repo out (it only needs the
          # enclosure artifacts), so `gh` has no git remote to infer the
          # repository from — it does NOT read GITHUB_REPOSITORY. Without
          # GH_REPO the final `gh release upload` fails with "could not
          # determine what repo to use". Every other `gh release upload` in this
          # workflow lives in a job that ran actions/checkout.
          GH_REPO: ${{ github.repository }}
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
          # Keep in step with Package.resolved (Sparkle 2.9.3).
          SPARKLE_VERSION: "2.9.3"
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail

          mkdir -p appcast-out

          if [ -z "${SPARKLE_ED_PRIVATE_KEY:-}" ]; then
            echo "::notice::SPARKLE_ED_PRIVATE_KEY is not configured — no appcast generated."
            exit 0
          fi
          if [ -z "$(find enclosures -name '*.app.zip' -print -quit 2>/dev/null)" ]; then
            echo "::notice::No Sparkle enclosures were produced — no appcast generated."
            exit 0
          fi

          echo "=== Fetching Sparkle ${SPARKLE_VERSION} tools ==="
          curl -fsSL -o sparkle-tools.tar.xz \
            "https://github.com/sparkle-project/Sparkle/releases/download/${SPARKLE_VERSION}/Sparkle-${SPARKLE_VERSION}.tar.xz"
          mkdir -p sparkle-tools
          tar xf sparkle-tools.tar.xz -C sparkle-tools
          GENERATE_APPCAST=$(find sparkle-tools -name generate_appcast -type f -perm +111 | head -1)
          if [ -z "${GENERATE_APPCAST}" ]; then
            echo "❌ generate_appcast not found in the Sparkle ${SPARKLE_VERSION} tarball"
            find sparkle-tools -maxdepth 3 -type d
            exit 1
          fi
          echo "Using ${GENERATE_APPCAST}"

          PREFIX="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/"

          for ARCH in arm64 amd64; do
            SRC=$(find enclosures -name "*-darwin-${ARCH}.app.zip" | head -1)
            if [ -z "${SRC}" ]; then
              echo "::warning::No ${ARCH} enclosure — skipping its feed."
              continue
            fi
            WORK="appcast-work-${ARCH}"
            rm -rf "${WORK}"
            mkdir -p "${WORK}"
            cp "${SRC}" "${WORK}/"

            echo "=== Generating appcast-${ARCH}.xml from $(basename "${SRC}") ==="
            # The key goes in on stdin so it never lands on disk or in `ps`.
            echo "${SPARKLE_ED_PRIVATE_KEY}" | "${GENERATE_APPCAST}" \
              --ed-key-file - \
              --download-url-prefix "${PREFIX}" \
              --link "https://github.com/${GITHUB_REPOSITORY}/releases/tag/${TAG}" \
              -o "appcast-out/appcast-${ARCH}.xml" \
              "${WORK}"
          done

          if [ -z "$(ls -A appcast-out 2>/dev/null)" ]; then
            echo "❌ generate_appcast produced no feeds"
            exit 1
          fi

          echo "=== Generated feeds ==="
          for f in appcast-out/*.xml; do
            echo "--- ${f} ---"
            cat "${f}"
            # Fail loudly rather than publish a feed with no enclosure signature:
            # an unsigned item is one Sparkle will refuse, silently, forever.
            grep -q 'sparkle:edSignature' "${f}" || { echo "❌ ${f} has no EdDSA signature"; exit 1; }
          done

          # Channel policy: RC users update to the next RC OR the next stable,
          # whichever is newer; stable users only ever see stables. A stable
          # release therefore also refreshes the BETA feeds with its (untagged,
          # visible-to-every-channel) item — otherwise RC users would sit on
          # their last RC forever once the cycle ends. SemVer precedence in the
          # tray orders X.Y.Z above X.Y.Z-rc.N, so the stable always wins.
          for ARCH in arm64 amd64; do
            if [ -f "appcast-out/appcast-${ARCH}.xml" ]; then
              cp "appcast-out/appcast-${ARCH}.xml" "appcast-out/appcast-beta-${ARCH}.xml"
            fi
          done

          # Upload the enclosures WITH the feeds: a feed must never go live
          # pointing at an asset the release doesn't carry (the v0.69.0 outage).
          # The release job normally attached them already (--clobber re-uploads
          # identical bytes); under post_release_only this is what attaches them.
          gh release upload "${TAG}" enclosures/*/*.app.zip appcast-out/*.xml --clobber
          echo "generated=true" >> "$GITHUB_OUTPUT"

      - name: Upload appcast artifact for the website repo
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: sparkle-appcast
          path: appcast-out/*
          if-no-files-found: ignore

      # Tell mcpproxy.app to serve the freshly uploaded feeds — see release.yml's
      # sparkle-appcast job for why this fails loudly instead of continue-on-error.
      - name: Publish feeds to mcpproxy.app
        if: steps.appcast.outputs.generated == 'true'
        uses: peter-evans/repository-dispatch@28959ce8df70de7be546dd1250a005dd32156697  # v4.0.1
        with:
          token: ${{ secrets.MARKETING_SITE_DISPATCH_TOKEN }}
          repository: smart-mcp-proxy/mcpproxy.app-website
          event-type: publish-appcast
          client-payload: '{"version": "${{ inputs.tag }}", "channel": "stable"}'

      # Second dispatch: the same stable release also refreshes the beta feeds
      # (see the channel-policy comment above).
      - name: Publish stable item to the beta feeds
        if: steps.appcast.outputs.generated == 'true'
        uses: peter-evans/repository-dispatch@28959ce8df70de7be546dd1250a005dd32156697  # v4.0.1
        with:
          token: ${{ secrets.MARKETING_SITE_DISPATCH_TOKEN }}
          repository: smart-mcp-proxy/mcpproxy.app-website
          event-type: publish-appcast
          client-payload: '{"version": "${{ inputs.tag }}", "channel": "beta"}'

      # End-to-end freshness check — see release.yml's sparkle-appcast job for
      # the full rationale (shared 15-min deadline, why this must fail loudly).
      - name: Verify live feeds are fresh
        if: steps.appcast.outputs.generated == 'true'
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          DEADLINE=$(( $(date +%s) + 15 * 60 ))
          FAILED=0
          for f in appcast-out/*.xml; do
            NAME=$(basename "$f")
            WANT=$(shasum -a 256 "$f" | cut -d' ' -f1)
            OK=""
            while :; do
              GOT=$(curl -fsSL "https://mcpproxy.app/${NAME}" 2>/dev/null | shasum -a 256 | cut -d' ' -f1 || true)
              if [ "$GOT" = "$WANT" ]; then OK=yes; break; fi
              if [ "$(date +%s)" -ge "$DEADLINE" ]; then break; fi
              sleep 15
            done
            if [ -n "$OK" ]; then
              echo "✅ https://mcpproxy.app/${NAME} serves the ${TAG} feed"
            else
              echo "::error::https://mcpproxy.app/${NAME} still does not serve the ${TAG} feed after 15 minutes — Sparkle users will be offered a stale version"
              FAILED=1
            fi
          done
          # A fresh feed is useless if its enclosure 404s — Sparkle then fails
          # every update with "couldn't download the update" (v0.69.0).
          for f in appcast-out/*.xml; do
            URL=$(sed -n 's/.*enclosure url="\([^"]*\)".*/\1/p' "$f" | head -1)
            if [ -z "$URL" ] || ! curl -fsIL -o /dev/null "$URL"; then
              echo "::error::$(basename "$f") enclosure is not downloadable: ${URL:-<none>}"
              FAILED=1
            else
              echo "✅ $(basename "$f") enclosure downloadable: ${URL}"
            fi
          done
          exit "$FAILED"

  # Opens the PR that deletes .github/RELEASE_NOTICE.md once this release has
  # carried it. See retire-release-notice.yml and release.yml's own call to it
  # for the full rationale (GITHUB_TOKEN-raised events never start a workflow
  # run, so release.yml/this workflow must call it directly as a job).
  retire-release-notice:
    needs: [release]
    if: ${{ !cancelled() && (needs.release.result == 'success' || inputs.post_release_only) && !contains(inputs.tag, '-') }}
    permissions:
      contents: write
      pull-requests: write
    uses: ./.github/workflows/retire-release-notice.yml
    with:
      tag: ${{ inputs.tag }}

  # Deploy documentation to Cloudflare Pages. Mirrors release.yml's deploy-docs
  # job; continue-on-error because docs failures must not block a release
  # catch-up dispatch.
  deploy-docs:
    needs: [release]
    if: ${{ !cancelled() && (needs.release.result == 'success' || inputs.post_release_only) && !contains(inputs.tag, '-') && github.repository == 'smart-mcp-proxy/mcpproxy-go' }}
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ inputs.tag }}

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: website/package-lock.json

      - name: Install dependencies
        working-directory: website
        run: npm ci

      # DOCS_VERSION drives the navbar version badge (website/docusaurus.config.js).
      - name: Build docs with version
        working-directory: website
        env:
          DOCS_VERSION: ${{ inputs.tag }}
        run: npm run build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0  # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy website/build --project-name=mcpproxy-docs

  # Trigger marketing site to update download links. Mirrors release.yml's
  # trigger-marketing-update job; continue-on-error for the same reason.
  trigger-marketing-update:
    needs: [release]
    if: ${{ !cancelled() && (needs.release.result == 'success' || inputs.post_release_only) && !contains(inputs.tag, '-') && github.repository == 'smart-mcp-proxy/mcpproxy-go' }}
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Trigger marketing site update
        uses: peter-evans/repository-dispatch@28959ce8df70de7be546dd1250a005dd32156697  # v4.0.1
        with:
          token: ${{ secrets.MARKETING_SITE_DISPATCH_TOKEN }}
          repository: smart-mcp-proxy/mcpproxy.app-website
          event-type: update-version
          client-payload: '{"version": "${{ inputs.tag }}"}'

  # Publish to the official MCP Registry. Mirrors release.yml's mcp-registry
  # job; continue-on-error because a registry hiccup must not block a release.
  mcp-registry:
    name: Publish to MCP Registry
    needs: [release]
    if: ${{ !cancelled() && (needs.release.result == 'success' || inputs.post_release_only) && !contains(inputs.tag, '-') }}
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ inputs.tag }}

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${TAG#v}" >> "$GITHUB_OUTPUT"
        env:
          TAG: ${{ inputs.tag }}

      - name: Install mcp-publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" | tar xz mcp-publisher

      - name: Authenticate to MCP Registry
        run: ./mcp-publisher login github-oidc

      - name: Update version in server.json
        run: |
          jq --arg v "${{ steps.version.outputs.VERSION }}" '.version = $v' server.json > server.tmp && mv server.tmp server.json

      - name: Publish to MCP Registry
        run: ./mcp-publisher publish
